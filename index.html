<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADMABS Integrated Business Platform</title>
    <style>
      /* Below the breakpoint: unchanged phone-card layout (also what ships in the Android/Capacitor app). */
      @media (min-width: 880px) {
        .admabs-shell { max-width: 1400px !important; box-shadow: 0 0 60px rgba(0,0,0,0.6); }
        .admabs-hamburger-btn { display: none !important; }
        .admabs-bottom-nav { display: none !important; }
        .admabs-app-row { flex-direction: row !important; }
        .admabs-desktop-nav { display: flex !important; }
        .admabs-main-col { min-width: 0; }
        .admabs-content { padding-left: max(24px, calc((100% - 1100px) / 2)) !important; padding-right: max(24px, calc((100% - 1100px) / 2)) !important; }
      }
    </style>
  </head>
  <body style="margin:0;background:#000;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
