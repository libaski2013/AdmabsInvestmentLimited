<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TEST ONLY — Fuel UI validation</title>
  </head>
  <body style="margin: 0; background: #f3f6fa">
    <div id="root"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import FuelOperations from "/src/FuelOperations.jsx";
      const shell = new URLSearchParams(location.search).get("shell");
      let Component = FuelOperations;
      if (shell === "documents") Component = (await import("/server/test/document-fixture.jsx")).default;
      if (shell === "desktop") Component = (await import("/src/desktop/DesktopApp.jsx")).default;
      if (shell === "mobile") {
        await import("/mobile-app/src/style.css");
        Component = (await import("/mobile-app/src/App.jsx")).default;
      }
      createRoot(document.getElementById("root")).render(
        React.createElement(Component, { user: { role: "super_admin" } }),
      );
    </script>
  </body>
</html>
